services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: devstash-admin-local-only
      POSTGRES_USER: devstash_admin
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstash_admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - devstash_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  devstash_postgres_data:
